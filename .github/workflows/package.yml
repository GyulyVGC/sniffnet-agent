name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.archive }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: sniffnet-agent-linux-x86_64
            os: unix
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: sniffnet-agent-linux-aarch64
            os: unix
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: sniffnet-agent-macos-x86_64
            os: unix
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: sniffnet-agent-macos-aarch64
            os: unix
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: sniffnet-agent-windows-x86_64
            os: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from Cargo.toml
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Install libpcap
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libpcap-dev

      - name: Install Npcap SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile "$env:RUNNER_TEMP\npcap-sdk.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\npcap-sdk.zip" -DestinationPath "$env:RUNNER_TEMP\npcap-sdk"
          "LIB=$env:RUNNER_TEMP\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Create Unix archive
        if: matrix.os == 'unix'
        shell: bash
        run: |
          BUNDLE="${{ matrix.archive }}-v${VERSION}"
          mkdir -p "dist/${BUNDLE}"
          cp "target/${{ matrix.target }}/release/sniffnet-agent" "dist/${BUNDLE}/"
          cp CHANGELOG.md LICENSE-APACHE LICENSE-MIT README.md "dist/${BUNDLE}/"
          mkdir -p "dist/${BUNDLE}/resources/repository/badges"
          cp resources/repository/badges/*.svg "dist/${BUNDLE}/resources/repository/badges/"
          tar -C dist -czf "dist/${{ matrix.archive }}.tar.gz" "${BUNDLE}"

      - name: Create Windows archive
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $bundleName = "${{ matrix.archive }}-v$env:VERSION"
          $bundle = "dist/$bundleName"
          New-Item -ItemType Directory -Path $bundle -Force
          Copy-Item "target/${{ matrix.target }}/release/sniffnet-agent.exe" $bundle
          Copy-Item CHANGELOG.md, LICENSE-APACHE, LICENSE-MIT, README.md $bundle
          $badgeDir = "$bundle/resources/repository/badges"
          New-Item -ItemType Directory -Path $badgeDir -Force
          Copy-Item "resources/repository/badges/*.svg" $badgeDir
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/${{ matrix.archive }}.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}-v${{ env.VERSION }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
