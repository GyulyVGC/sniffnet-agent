[package]
name = "sniffnet-agent"
version = "0.0.0"
authors = ["Giuliano Bellini <gyulyvgc99@gmail.com>"]
edition = "2024"
description = "Lightweight network flows exporter compatible with Sniffnet"
readme = "README.md"
homepage = "https://sniffnet.net"
repository = "https://github.com/GyulyVGC/sniffnet-agent"
documentation = "https://github.com/GyulyVGC/sniffnet/wiki"
license = "MIT OR Apache-2.0"
keywords = ["filter", "network", "packet", "sniffer", "gui"]
categories = ["visualization", "gui", "network-programming"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
etherparse = "0.20.1"
pcap = "2.4.0"
tracing = "0.1.144"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
