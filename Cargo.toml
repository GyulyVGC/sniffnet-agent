[package]
name = "sniffnet-agent"
version = "0.1.0"
authors = ["Giuliano Bellini <gyulyvgc99@gmail.com>"]
edition = "2024"
description = "Lightweight network flows exporter compatible with Sniffnet"
readme = "README.md"
homepage = "https://sniffnet.app"
repository = "https://github.com/sniffnet/sniffnet-agent"
documentation = "https://github.com/GyulyVGC/sniffnet/wiki"
license = "MIT OR Apache-2.0"
keywords = ["network", "ipfix", "sniffer", "cli"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
etherparse = "0.20.1"
pcap = "2.4.0"
log = "0.4.30"
jiff = "0.2.27"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[badges]
maintenance = { status = "actively-developed" }
